# Speaker discovery is multicast (SSDP for Sonos and DLNA, mDNS for Cast), which does not cross
# Docker's bridge network, hence host networking. That needs Docker on Linux.

name: roomcast

services:
  roomcast:
    image: ghcr.io/samoturk/roomcast-mcp:latest
    # Or build it from this checkout instead:
    # build: .
    restart: unless-stopped
    network_mode: host
    env_file: .env

  # Optional: publishes roomcast with Tailscale Funnel. Skip it (and run
  # `tailscale funnel --bg 8765` on the host) if the machine already runs Tailscale.
  #   docker compose --profile tailscale up -d
  tailscale:
    profiles: [tailscale]
    image: tailscale/tailscale:v1.88.3
    restart: unless-stopped
    network_mode: host
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: ${TS_HOSTNAME:-roomcast}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro

volumes:
  tailscale-state:
